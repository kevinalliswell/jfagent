name: Publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: kevinalliswell

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality-gate dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install python-docx openpyxl pdfplumber pypdf

      - name: Run quality gate
        run: PYTHON_BIN=python npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jfagent-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jfagent-api:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jfagent-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            VITE_SESSION_API_MODE=backend
            VITE_API_BASE_URL=same-origin
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jfagent-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jfagent-web:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jfagent-web:${{ github.sha }}
